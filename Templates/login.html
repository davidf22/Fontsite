{% extends "layout.html" %} 
{% load static %}

{% block content %}

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row w-100">
        <!-- Image on the left -->
        <div class="col-md-6 d-none d-md-flex justify-content-center">
            <img src="{% static '/assets/Group1.png' %}" alt="Login Image" class="img-fluid">
            <div class="overlay-text" style="
                position: absolute;
                top: 50%;
                left: 30%;
                transform: translate(-50%, -50%);
                color: black;
                font-size: 40px;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
                text-align: center;
                z-index: 2;
                padding: 150px;">Fonts Resort</div>
        </div>

<div class="col-md-6">
    <div class="card shadow-none p-5" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div>
                <h9>
                    By signing up you agree to terms and conditions at fonts.
                </h9>
            </div>
            <div class="d-grid mb-4">
                <button type="submit" class="btn btn-primary">Login</button>
                
            </div>
        </form>
        <div class="d-flex justify-content-around">
            <a  href="https://accounts.google.com/signin" target="_blank" class="btn btn-outline-danger">Google</a>
            <a  href="https://www.facebook.com/login" target="_blank" class="btn btn-outline-primary">Facebook</a>
            <a  href="https://login.yahoo.com" target="_blank" class="btn btn-outline-dark">Yahoo</a>
        </div>
    </div>
</div>


{% endblock %}
